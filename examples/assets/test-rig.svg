<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic acoustic-monitoring test arrangement</title>
  <desc id="desc">A motor housing, microphone, edge node, and analysis laptop connected as a measurement chain.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/><stop offset="1" stop-color="#e9f2f5"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#287c91"/>
    </marker>
  </defs>
  <rect width="900" height="430" rx="24" fill="url(#panel)"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#183442">
    <text x="42" y="47" font-size="24" font-weight="700" fill="#004772">SYNTHETIC EVALUATION ARRANGEMENT</text>
    <text x="42" y="73" font-size="14" fill="#5c7884">Illustrative geometry · no physical apparatus or recorded data</text>

    <g transform="translate(58 122)">
      <rect width="240" height="218" rx="18" fill="#fff"/>
      <rect x="42" y="68" width="154" height="91" rx="16" fill="#dbeaf0" stroke="#287c91" stroke-width="4"/>
      <circle cx="83" cy="113" r="29" fill="#fff" stroke="#004772" stroke-width="6"/>
      <circle cx="156" cy="113" r="29" fill="#fff" stroke="#004772" stroke-width="6"/>
      <path d="M62 57 v-22 h115 v22" fill="none" stroke="#f28e5b" stroke-width="7" stroke-linecap="round"/>
      <path d="M120 35 v-17" stroke="#f28e5b" stroke-width="7" stroke-linecap="round"/>
      <path d="M37 170 h166" stroke="#a8bbc3" stroke-width="5" stroke-linecap="round"/>
      <text x="120" y="198" text-anchor="middle" font-size="17" font-weight="700">MOTOR HOUSING</text>
    </g>

    <path d="M318 231 C338 231 338 192 357 192 S376 278 395 278 S414 170 433 170 S452 248 471 248" fill="none" stroke="#f28e5b" stroke-width="5" stroke-linecap="round"/>
    <text x="395" y="314" text-anchor="middle" font-size="13" fill="#b94f28">airborne transient</text>

    <g transform="translate(490 143)">
      <rect width="134" height="176" rx="18" fill="#fff"/>
      <circle cx="67" cy="52" r="30" fill="#dff3ee" stroke="#278d78" stroke-width="4"/>
      <circle cx="67" cy="52" r="8" fill="#278d78"/>
      <path d="M67 14 v-12 M39 25 l-10-10 M95 25 l10-10" stroke="#278d78" stroke-width="4" stroke-linecap="round"/>
      <rect x="31" y="102" width="72" height="35" rx="7" fill="#e8f1f5" stroke="#287c91" stroke-width="3"/>
      <circle cx="45" cy="119" r="5" fill="#f28e5b"/>
      <path d="M57 119 h34" stroke="#287c91" stroke-width="4"/>
      <text x="67" y="160" text-anchor="middle" font-size="15" font-weight="700">EDGE NODE</text>
    </g>

    <path d="M640 231 H700" stroke="#287c91" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="669" y="216" text-anchor="middle" font-size="12" fill="#52717e">score</text>

    <g transform="translate(716 144)">
      <rect width="132" height="174" rx="16" fill="#fff"/>
      <rect x="18" y="22" width="96" height="98" rx="7" fill="#edf5f7" stroke="#004772" stroke-width="3"/>
      <path d="M27 99 L42 85 L55 91 L70 60 L82 67 L101 40" fill="none" stroke="#287c91" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M17 132 h98 l13 18 H4 Z" fill="#dbeaf0" stroke="#004772" stroke-width="3"/>
      <text x="66" y="168" text-anchor="middle" font-size="15" font-weight="700">ANALYSIS</text>
    </g>

    <g transform="translate(313 366)">
      <circle cx="0" cy="0" r="7" fill="#f28e5b"/>
      <text x="15" y="5" font-size="13">synthetic acoustic path</text>
      <circle cx="213" cy="0" r="7" fill="#278d78"/>
      <text x="228" y="5" font-size="13">measurement and edge decision</text>
    </g>
  </g>
</svg>
